name: Deploy

# 推 main 时：先跑基础检查，再 SSH 到服务器重新构建发布。
# 需在仓库 Settings → Secrets and variables → Actions 配置：
#   SSH_HOST / SSH_USER / SSH_KEY / DEPLOY_PATH
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home_design_agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit==2.9.0

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend
        working-directory: home_design_agent/frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Django deploy check
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_SECURE_SSL_REDIRECT: 'true'
          DJANGO_SECURE_COOKIES: 'true'
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run backend tests
        run: pytest -q

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # 只有配置了服务器信息才执行，避免 fork 或未配 secret 时报错
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "未配置 SSH_HOST，跳过自动部署"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          REPO_ROOT="$(dirname "$DEPLOY_PATH")"
          ssh -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" bash -se <<EOF
            set -euo pipefail
            git -C "$REPO_ROOT" fetch origin --quiet
            git -C "$REPO_ROOT" reset --hard origin/main
            cd "$DEPLOY_PATH"
            docker compose up -d --build
            docker compose restart nginx
            docker compose ps
          EOF

      - name: Health check
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="https://plankeai-home.com/api/talkbot/health/"
          fi
          if [[ "$HEALTH_URL" != https://* ]]; then
            echo "HEALTH_URL 必须使用 HTTPS"
            exit 1
          fi
          HEALTH_URL="${HEALTH_URL%/}"
          HEALTH_URL="${HEALTH_URL%/api/design/health}"
          if [[ "$HEALTH_URL" != */api/talkbot/health ]]; then
            HEALTH_URL="$HEALTH_URL/api/talkbot/health"
          fi
          HEALTH_URL="$HEALTH_URL/"
          echo "检查 TalkBot 就绪状态：$HEALTH_URL"
          for i in $(seq 1 10); do
            if curl -fsS --connect-timeout 5 --max-time 10 "$HEALTH_URL" | python3 -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if data.get("ready") is True else 1)'; then
              echo "ready"
              exit 0
            fi
            sleep 10
          done
          echo "TalkBot 就绪检查失败"; exit 1
