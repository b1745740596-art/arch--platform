name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: home_design_agent/frontend
        run: npm install

      - name: Build web assets
        working-directory: home_design_agent/frontend
        run: npm run build

      - name: Add Android platform
        working-directory: home_design_agent/frontend
        run: npx cap add android

      - name: Sync Android project
        working-directory: home_design_agent/frontend
        run: npx cap sync android

      - name: Apply version metadata
        working-directory: home_design_agent/frontend
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          cfg = json.loads(pathlib.Path('capacitor.config.json').read_text())
          rel = json.loads(pathlib.Path('../app_release.json').read_text())
          version = cfg.get('version', '1.0.0')
          build = int(rel.get('build', 1))
          gradle = pathlib.Path('android/app/build.gradle')
          text = gradle.read_text()
          text = re.sub(r'versionCode\s+\d+', f'versionCode {build}', text, count=1)
          text = re.sub(r'versionName\s+"[^"]*"', f'versionName "{version}"', text, count=1)
          gradle.write_text(text)
          print('versionCode', build, 'versionName', version)
          PY

      - name: Build debug APK
        working-directory: home_design_agent/frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Arch AI APK
          files: home_design_agent/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
