name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: home_design_agent/frontend
        run: npm install

      - name: Build web assets
        working-directory: home_design_agent/frontend
        run: npm run build

      - name: Add Android platform
        working-directory: home_design_agent/frontend
        run: npx cap add android

      - name: Sync Android project
        working-directory: home_design_agent/frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: home_design_agent/frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Arch AI APK
          files: home_design_agent/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
