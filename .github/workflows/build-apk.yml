name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: home_design_agent/frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Build web assets
        working-directory: home_design_agent/frontend
        run: npm run build

      - name: Add Android platform
        working-directory: home_design_agent/frontend
        run: npx cap add android

      - name: Sync Android project
        working-directory: home_design_agent/frontend
        run: npx cap sync android

      - name: Add native app plugins
        working-directory: home_design_agent/frontend
        run: |
          mkdir -p android/app/src/main/java/com/archai/home
          cp native/android/ApkUpdaterPlugin.java android/app/src/main/java/com/archai/home/ApkUpdaterPlugin.java
          cp native/android/CameraCapturePlugin.java android/app/src/main/java/com/archai/home/CameraCapturePlugin.java
          cp native/android/MainActivity.java android/app/src/main/java/com/archai/home/MainActivity.java

      - name: Apply version metadata
        working-directory: home_design_agent/frontend
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          cfg = json.loads(pathlib.Path('capacitor.config.json').read_text())
          rel = json.loads(pathlib.Path('../app_release.json').read_text())
          version = cfg.get('version', '1.0.0')
          build = int(rel.get('build', 1))
          gradle = pathlib.Path('android/app/build.gradle')
          text = gradle.read_text()
          text = re.sub(r'versionCode\s+\d+', f'versionCode {build}', text, count=1)
          text = re.sub(r'versionName\s+"[^"]*"', f'versionName "{version}"', text, count=1)
          gradle.write_text(text)
          print('versionCode', build, 'versionName', version)
          PY

      - name: Replace splash and status bar with white
        working-directory: home_design_agent/frontend
        run: |
          cp resources/splash.png android/app/src/main/res/drawable/splash.png
          for dir in android/app/src/main/res/drawable*/; do
            cp resources/splash.png "$dir/splash.png"
          done
          python3 - <<'PY'
          import pathlib
          styles = pathlib.Path('android/app/src/main/res/values/styles.xml')
          styles.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
                  <item name="android:statusBarColor">@color/colorPrimaryDark</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
                  <item name="android:statusBarColor">@color/colorPrimaryDark</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">@drawable/splash</item>
                  <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>''')
          colors = pathlib.Path('android/app/src/main/res/values/colors.xml')
          colors.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#FFFFFF</color>
              <color name="colorPrimaryDark">#FFFFFF</color>
              <color name="colorAccent">#23A97C</color>
          </resources>''')
          print('splash and status bar patched')
          PY

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required GitHub Secret: ${secret_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure release APK signing
        working-directory: home_design_agent/frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.p12
          if [ ! -s android/app/keystore.p12 ]; then
            echo "::error::Decoded Android keystore is empty"
            exit 1
          fi
          chmod 600 android/app/keystore.p12
          python3 - <<'PY'
          import pathlib, re
          gradle = pathlib.Path('android/app/build.gradle')
          text = gradle.read_text()
          signing = '''    signingConfigs {
                  release {
                      storeFile file('keystore.p12')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          '''
          if 'signingConfigs' not in text:
              text = text.replace('    buildTypes {', signing + '    buildTypes {', 1)
          text = re.sub(
              r'    buildTypes \{\s*\n        release \{\s*\n            minifyEnabled false\s*\n            proguardFiles[^\n]*\n        \}\n    \}',
              '''    buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }''',
              text,
              flags=re.S,
          )
          gradle.write_text(text)
          print('release signing configured from GitHub Secrets')
          PY

      - name: Build signed release APK
        working-directory: home_design_agent/frontend/android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Arch AI APK
          files: home_design_agent/frontend/android/app/build/outputs/apk/release/app-release.apk
          prerelease: false

      - name: Upload APK to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "SSH_HOST not configured; skip APK upload"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_rsa home_design_agent/frontend/android/app/build/outputs/apk/release/app-release.apk "$SSH_USER@$SSH_HOST:/tmp/arch-ai.apk"
          ssh -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "docker run --rm -v home_design_agent_media:/data -v /tmp:/src alpine sh -c 'mkdir -p /data/app && cp /src/arch-ai.apk /data/app/arch-ai.apk'"
