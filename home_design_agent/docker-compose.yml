# 生产部署：nginx（静态/媒体 + 长超时代理） + gunicorn（Django） + PostgreSQL
# 用法见 deploy/DEPLOY.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_design}
      POSTGRES_USER: ${POSTGRES_USER:-home_design}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-home_design} -d ${POSTGRES_DB:-home_design}']
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY 必填}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:-plankeai-home.com}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      # 此 Compose 文件仅用于生产，HTTPS 与 Secure Cookie 强制开启。
      DJANGO_SECURE_SSL_REDIRECT: 'true'
      DJANGO_SECURE_COOKIES: 'true'
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-86400}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-true}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
      DJANGO_CACHE_BACKEND: ${DJANGO_CACHE_BACKEND:-django.core.cache.backends.redis.RedisCache}
      DJANGO_CACHE_LOCATION: ${DJANGO_CACHE_LOCATION:-redis://cache:6379/1}
      DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-2}
      DATABASE_URL: postgres://${POSTGRES_USER:-home_design}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-home_design}
      SEED_ON_START: ${SEED_ON_START:-0}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
      TALKBOT_LLM_ENABLED: ${TALKBOT_LLM_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-25}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-1}
      # ---- 支付与额度（上线时按 .env.example 配置）----
      PAYMENT_MODE: ${PAYMENT_MODE:-live}
      PAYMENT_FREE_CREDITS: ${PAYMENT_FREE_CREDITS:-5}
      PAYMENT_STRIPE_SECRET_KEY: ${PAYMENT_STRIPE_SECRET_KEY:-}
      PAYMENT_STRIPE_PUBLIC_KEY: ${PAYMENT_STRIPE_PUBLIC_KEY:-}
      PAYMENT_STRIPE_WEBHOOK_SECRET: ${PAYMENT_STRIPE_WEBHOOK_SECRET:-}
      PAYMENT_STRIPE_CURRENCY: ${PAYMENT_STRIPE_CURRENCY:-hkd}
      PAYMENT_STRIPE_EXCHANGE_RATE: ${PAYMENT_STRIPE_EXCHANGE_RATE:-1.09}
      PAYMENT_STRIPE_TAX_CODE: ${PAYMENT_STRIPE_TAX_CODE:-txcd_10000000}
      PAYMENT_STRIPE_API_VERSION: ${PAYMENT_STRIPE_API_VERSION:-2025-03-31.basil}
      PAYMENT_WECHAT_APP_ID: ${PAYMENT_WECHAT_APP_ID:-}
      PAYMENT_WECHAT_MCH_ID: ${PAYMENT_WECHAT_MCH_ID:-}
      PAYMENT_WECHAT_SERIAL_NO: ${PAYMENT_WECHAT_SERIAL_NO:-}
      PAYMENT_WECHAT_PRIVATE_KEY: ${PAYMENT_WECHAT_PRIVATE_KEY:-}
      PAYMENT_WECHAT_API_V3_KEY: ${PAYMENT_WECHAT_API_V3_KEY:-}
      PAYMENT_WECHAT_PLATFORM_PUBLIC_KEY: ${PAYMENT_WECHAT_PLATFORM_PUBLIC_KEY:-}
      PAYMENT_WECHAT_NOTIFY_URL: ${PAYMENT_WECHAT_NOTIFY_URL:-}
      PAYMENT_ALIPAY_APP_ID: ${PAYMENT_ALIPAY_APP_ID:-}
      PAYMENT_ALIPAY_PRIVATE_KEY: ${PAYMENT_ALIPAY_PRIVATE_KEY:-}
      PAYMENT_ALIPAY_PUBLIC_KEY: ${PAYMENT_ALIPAY_PUBLIC_KEY:-}
      PAYMENT_ALIPAY_SELLER_ID: ${PAYMENT_ALIPAY_SELLER_ID:-}
      PAYMENT_ALIPAY_NOTIFY_URL: ${PAYMENT_ALIPAY_NOTIFY_URL:-}
      # ---- 邮件 / 密码重置 ----
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-true}
      DJANGO_EMAIL_USE_SSL: ${DJANGO_EMAIL_USE_SSL:-false}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-noreply@example.com}
      DJANGO_PASSWORD_RESET_TIMEOUT_MINUTES: ${DJANGO_PASSWORD_RESET_TIMEOUT_MINUTES:-30}
      # ---- 短信 / 邮箱验证码 ----
      SMS_BACKEND: ${SMS_BACKEND:-webhook}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_CODE_TTL_MINUTES: ${SMS_CODE_TTL_MINUTES:-5}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-5}
      EMAIL_CODE_TTL_MINUTES: ${EMAIL_CODE_TTL_MINUTES:-5}
      EMAIL_CODE_MAX_ATTEMPTS: ${EMAIL_CODE_MAX_ATTEMPTS:-5}
    volumes:
      - media:/data/media
      - static:/app/staticfiles

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro
      - static:/app/staticfiles:ro

volumes:
  pgdata:
  media:
  static:
