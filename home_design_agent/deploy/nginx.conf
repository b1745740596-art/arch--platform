# nginx 反向代理：静态/媒体直发，API 走长超时
upstream app_server {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # 毛坯照片上传上限 10MB，留余量
    client_max_body_size 32m;
    client_body_buffer_size 1m;
    client_body_timeout 600s;

    # 生图为同步长请求：图生图 60-180s，后端轮询上限 300s，前端超时 360s。
    # 这里必须大于前端超时，否则 nginx 会先返回 504。
    proxy_connect_timeout 75s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;

    # PWA manifest：显式指定 MIME，浏览器才认可可安装 Web App
    location = /static/spa/manifest.webmanifest {
        alias /app/staticfiles/spa/manifest.webmanifest;
        default_type application/manifest+json;
        access_log off;
        add_header Cache-Control "public";
    }

    # collectstatic 产物（含 /static/spa/ 前端资源）
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 生成的效果图与上传原图
    location /media/ {
        alias /data/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/design/health/ {
        access_log off;
        proxy_pass http://app_server;
    }

    location / {
        proxy_pass http://app_server;
    }
}
