# nginx 反向代理：静态资源直发，私有媒体/API 转 Django
upstream app_server {
    server web:8000;
}

# CDN/TLS 代理传入原始 scheme；直连时回落为 nginx 自己看到的 scheme。
map $http_x_forwarded_proto $origin_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    # SimpleUI 会调整 Django 的 frame 中间件；在代理层再做一层不可绕过的兜底。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # 毛坯照片上传上限 10MB，留余量
    client_max_body_size 32m;
    client_body_buffer_size 1m;
    client_body_timeout 600s;

    # 生图为同步长请求：图生图 60-180s，后端轮询上限 300s，前端超时 360s。
    # 这里必须大于前端超时，否则 nginx 会先返回 504。
    proxy_connect_timeout 75s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $origin_scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;

    # PWA manifest：显式指定 MIME，浏览器才认可可安装 Web App
    location = /static/spa/manifest.webmanifest {
        alias /app/staticfiles/spa/manifest.webmanifest;
        default_type application/manifest+json;
        access_log off;
        add_header Cache-Control "public";
    }

    # collectstatic 产物（含 /static/spa/ 前端资源）
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 私有媒体必须由 Django 校验登录态和文件所属关系，禁止 nginx 匿名直发。
    location /media/ {
        proxy_pass http://app_server;
    }

    location /api/talkbot/health/ {
        access_log off;
        proxy_pass http://app_server;
    }

    location / {
        proxy_pass http://app_server;
    }
}
